name: Darija linguistic feedback
description: Report a Darija coverage, spelling, dialect, or code-switching issue.
title: "[Linguistic]: "
labels: ["linguistics"]
body:
  - type: dropdown
    id: script
    attributes:
      label: Script
      options:
        - Arabic script
        - Arabizi
        - Mixed
        - Other
    validations:
      required: true
  - type: input
    id: region
    attributes:
      label: Region or variety (optional)
  - type: textarea
    id: example
    attributes:
      label: Example
      description: Use a short example you have permission to share. Remove personal information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Intended meaning or preferred rendering
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and notes
